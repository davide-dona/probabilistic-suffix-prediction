data:
  name: bpic19

  case_key: "case:concept:name"
  activity_key: "concept:name"
  resource_key: "org:resource"
  timestamp_key: "time:timestamp"

  # The test block is nominally the last fifth of cases by start time, and validation the
  # latest-starting share of what remains. BPIC19 is long-running purchase orders, though: almost
  # half its cases are still open at the separation time, and the leak-prevention narrowing hands
  # every one of them to the test set rather than dropping it, so the realized test share lands
  # near 50% instead of the configured 0.2.
  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len_percentile: 98.5

  # Both read as booleans, which this pipeline would take for numeric channels; they are flags
  # with a vocabulary of two, and SuTraN reads them as categoricals too.
  string_features:
    - case:GR-Based Inv. Verif.
    - case:Goods Receipt

  # Every column but the structural ones above and: `User`, identical to `org:resource` in
  # every row; `case:Purchasing Document` and `case:Item`, which concatenate to exactly
  # `case:concept:name` and would hand the model the case ID; and `case:Name`, a deterministic
  # relabelling of `case:Vendor` (same 1975-vendor vocabulary under a different string).
  event_features:
    # Case-level: share the same value for every row in a case
    - case:Spend area text
    - case:Company
    - case:Document Type
    - case:Sub spend area text
    - case:Purch. Doc. Category name
    - case:Vendor
    - case:Item Type
    - case:Item Category
    - case:Spend classification text
    - case:Source
    - case:GR-Based Inv. Verif.
    - case:Goods Receipt
    # Event-level: vary per row in a case
    - Cumulative net worth (EUR)
    # Calendar position of the event
    - day_in_week
    - seconds_in_day

  # Every numeric channel is standardized raw, as in `bpic17.yaml`.
  log_scaled_features: []
  log_scaled_durations: false
  batch_size: 256
  num_workers: 0

# Same size as `bpic17.yaml`: base.yaml is already sized for the bpic logs.
