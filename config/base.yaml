seed: 42

# Declarative model discovered from the train split during preprocessing,
# written to data/<dataset>/declare/model.decl.
declare:
  consider_vacuity: false # unactivated constraints are considered as violated
  min_support: 0.8        # fraction of train traces that satisfy a constraint for it to be included in the model
  itemsets_support: 0.9   # build itemsets of activities that co-occur in at least this fraction of train traces
  max_cardinality: 2      # highest n tried for the templates that take one


# Model architecture
model:
  # Names every run this architecture produces, and the series it is drawn as.
  name: cvae-cat

  # The size of the embedding space
  d_model: 128

  # Activity/resource lookup widths, concatenated with the time delta, the data section's
  # event_features and their present flags, and projected to d_model.
  embeddings:
    activity_dim: 16
    resource_dim: 32  
    feature_dim: 8  # per categorical event feature; each one widens the projection's input

  # Encodes the prefix; its CLS summary feeds both the prior and the decoder's cross-attention.
  prefix_encoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 512  # 4x d_model ratio
    dropout: 0.1

  # MLP mapping the prefix summary to p(k|prefix), the mode a suffix is written under.
  prior:
    hidden_dims: [128]  # (empty for a linear prior)
    dropout: 0.1

  latent:
    # Ways one prefix may carry on. Every training step writes the suffix under all of them, so
    # this is the factor the decoder's work is multiplied by. A generation draws from
    # p(k|prefix) with replacement, so it is unrelated to inference.num_samples.
    num_modes: 16

  # Causal self-attention over the suffix, cross-attention over the encoded prefix.
  decoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 512
    dropout: 0.1
    activity_dropout: 0.3  # teacher-forced activities blanked in training, so the decoder must lean on the mode
    head_hidden_dim: 128

# All the hyperparameters below are defined in steps, not epochs,
# so that they are independent of the dataset size and batch size.
# lr is set per hardware profile, in config/hardware/, since it scales with batch_size.
optimizer:
  weight_decay: 0.0

training:
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  # Fixed slice of the evaluation set used for validation;
  # Using the full evaluation set for validation would be too slow
  validation_pairs: 20000
  generation_pairs: 1024
  

early_stopping:
  patience: 30   # number of validation checks with no improvement after which training will be stopped
  min_delta_perc: 0.005  # the mode is sampled, so the score is noisy; this is the margin that counts as progress


inference:
  # At least ten, since hit_rate_at_10 reads the tenth draw.
  num_samples: 10
