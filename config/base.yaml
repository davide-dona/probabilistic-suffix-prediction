seed: 42

# Declarative model discovered from the train split during preprocessing,
# written to data/<dataset>/declare/model.decl.
declare:
  consider_vacuity: false # unactivated constraints are considered as violated
  min_support: 0.8        # fraction of train traces that satisfy a constraint for it to be included in the model
  itemsets_support: 0.9   # build itemsets of activities that co-occur in at least this fraction of train traces
  max_cardinality: 2      # highest n tried for the templates that take one


# Model architecture
model:
  # Names every run this architecture produces, and the series it is drawn as.
  name: cvae

  # The size of the embedding space
  d_model: 128

  # Activity/resource lookup widths, concatenated with the time delta, the data section's
  # event_features and their present flags, and projected to d_model.
  embeddings:
    activity_dim: 16
    resource_dim: 32  
    feature_dim: 8  # per categorical event feature; each one widens the projection's input

  # Encodes the prefix; its CLS summary feeds both the prior and the decoder's cross-attention.
  prefix_encoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 512  # 4x d_model ratio
    dropout: 0.1

  # Encodes the ground-truth suffix for the posterior, training only; shallower on purpose.
  suffix_encoder:
    num_layers: 2 
    num_heads: 4
    feedforward_dim: 512
    dropout: 0.1

  # MLP mapping the prefix summary to p(z|prefix), sampled from at inference.
  prior:
    hidden_dims: [128]  # (empty for a linear prior)
    dropout: 0.1

  latent:
    latent_dim: 16  # z only carries what the prefix leaves undetermined

  # Causal self-attention over the suffix, cross-attention over the encoded prefix.
  decoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 512
    dropout: 0.1
    activity_dropout: 0.3  # teacher-forced activities blanked in training, so the decoder must lean on z
    head_hidden_dim: 128

# All the hyperparameters below are defined in steps, not epochs, 
# so that they are independent of the dataset size and batch size.
loss:
  # KL annealing: the KL term is ramped up from 0 to full weight over the first
  # `kl_annealing_ramp_steps` steps, set per hardware profile, then held there for the rest of the
  # run. This helps prevent posterior collapse early in training.
  kl_annealing_start_weight: 0.0
  # Plain ELBO. The bpic17 sweep over 0.25/0.5/1.0/2.0/4.0 put the energy score's optimum here:
  # below it z carries more nats and the samples drift off what the prior can produce, above it the
  # KL squeezes the latent onto the free-bits floor.
  kl_annealing_full_weight: 1.0
  free_bits: 0.3  # nats/dimension floor below which the KL is not penalized; keeps z from collapsing

# lr is set per hardware profile, in config/hardware/, since it scales with batch_size.
optimizer:
  weight_decay: 0.0

training:
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  # Fixed slice of the evaluation set used for validation;
  # Using the full evaluation set for validation would be too slow
  validation_pairs: 20000
  generation_pairs: 1024
  

early_stopping:
  patience: 30   # number of validation checks with no improvement after which training will be stopped
  min_delta_perc: 0.005  # z is sampled, so the score is noisy; this is the margin that counts as progress


inference:
  # Suffixes drawn per prefix, once for each of the two passes that generate them.
  # At least ten on either, since hit_rate_at_10 reads the tenth draw.

  # The pass inside the training loop, over training.generation_pairs prefixes every
  # training.val_every_n_steps steps. Kept small: it is paid for on every validation.
  validation_samples: 10
  # The pass over the whole test split that a report is built from. Paid for once per run, and a
  # hundred draws describe p(suffix | prefix) far better than ten.
  evaluation_samples: 100
