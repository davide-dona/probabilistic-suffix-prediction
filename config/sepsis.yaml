data:
  name: sepsis

  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"

  # The test block is the last fifth of cases by start time, and validation the latest-starting
  # share of what remains.
  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len_percentile: 98.5

  string_features: []

  # Every column but the structural ones above and: `lifecycle:transition`, constant at
  # `complete` for every row; `Diagnose`, 95% missing over a 145-way vocabulary and effectively
  # the case outcome; and `DiagnosticOther`, 93% missing where the other `Diagnostic*` flags are
  # far denser.
  event_features:
    - DiagnosticArtAstrup
    - DiagnosticBlood
    - DiagnosticECG
    - DiagnosticIC
    - DiagnosticLacticAcid
    - DiagnosticLiquor
    - DiagnosticSputum
    - DiagnosticUrinaryCulture
    - DiagnosticUrinarySediment
    - DiagnosticXthorax
    - DisfuncOrg
    - Hypotensie
    - Hypoxie
    - InfectionSuspected
    - Infusion
    - Oligurie
    - SIRSCritHeartRate
    - SIRSCritLeucos
    - SIRSCritTachypnea
    - SIRSCritTemperature
    - SIRSCriteria2OrMore
    - Age
    - CRP
    - LacticAcid
    - Leucocytes
    # Calendar position of the event
    - day_in_week
    - seconds_in_day

  # Every numeric channel is standardized raw, as both baselines do: SuTraN runs with
  # `log_transformed = False`, U-ED-LSTM with an empty `num_dyn_log`.
  log_scaled_features: []
  log_scaled_durations: false
  batch_size: 256
  num_workers: 0  # 0, not 4: macOS spawn overhead measured 2.1x slower end to end
