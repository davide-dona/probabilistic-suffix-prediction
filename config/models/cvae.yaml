# The conditional VAE: the backbone below, plus the latent the variability lives in
seed: 42

dataloader:
  batch_size: 4096
  # 48 vCPUs, so cores are not the constraint: each worker prefetches two of these batches,
  # and a batch of 4096 padded prefix/suffix pairs is hundreds of MB of host memory.
  num_workers: 12

model:
  kind: cvae
  # Names every run this architecture produces, and the series it is drawn as.
  name: cvae

  # The size of the embedding space
  d_model: 32

  # Activity/resource lookup widths, concatenated with the time delta, the data section's
  # event_features and their present flags, and projected to d_model.
  embeddings:
    activity_dim: 16
    resource_dim: 32
    feature_dim: 8  # per categorical event feature; each one widens the projection's input

  # Reads both sequences: the prefix, whose CLS summary feeds the prior and whose events the
  # decoder cross-attends over, and, during training only, the ground-truth suffix, whose
  # summary feeds the posterior.
  encoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1

  # MLP mapping the prefix summary to p(z|prefix), sampled from at inference.
  prior:
    hidden_dims: [128]  # (empty for a linear prior)
    dropout: 0.1

  latent:
    latent_dim: 16  # z only carries what the prefix leaves undetermined

  # Causal self-attention over the suffix, cross-attention over the encoded prefix. Its heads are
  # read greedily: a suffix is one draw from z rather than a run of independent per-step draws.
  decoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1
    activity_dropout: 0.3  # teacher-forced activities blanked in training, so the decoder must lean on z
    head_hidden_dim: 128

  # All the hyperparameters below are defined in steps, not epochs, so that they are independent
  # of the dataset size and batch size. The only architecture here with a KL term to weigh.
  loss:
    # KL annealing: the KL term is ramped up from 0 to full weight over the first
    # `kl_annealing_ramp_steps` steps.
    kl_annealing_ramp_steps: 1500
    # Plain ELBO
    kl_annealing_start_weight: 0.0
    kl_annealing_full_weight: 1.0
    # nats/dimension floor below which the KL is not penalized; keeps z from collapsing
    free_bits: 0.3

optimizer:
  lr: 0.0012
  weight_decay: 0.0
  # A batch this wide takes a few hundred steps to settle; starting it at the full rate is what
  # makes those the steps a run never recovers from. Nothing decays it afterwards.
  warmup_steps: 300

training:
  # Dual RTX A6000 workstation, 48GB GPU memory each; `cuda:0` pins one of the two.
  device: cuda:0
  max_steps: 10000
  # Halved to pay for `inference.validation_samples`: the generation pass on every check now draws
  # ten times what it did, and validating half as often leaves a run in the same wall clock.
  val_every_n_steps: 100
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  # Fixed slice of the evaluation set used for validation;
  # Using the full evaluation set for validation would be too slow
  validation_pairs: 20000
  generation_pairs: 1024

early_stopping:
  # Non-improving validation checks tolerated before training stops. Counted in checks, so it was
  # halved alongside `training.val_every_n_steps`: the stall it sits through is the same 1500 steps.
  patience: 15
  min_delta_perc: 0.005  # z is sampled, so the score is noisy; this is the margin that counts as progress

# Suffixes drawn per prefix, once for each of the two passes that generate them. Both draw the same
# number: EMSC read at a smaller budget is a different number rather than a noisier one, and the
# shortfall falls hardest on the model whose draws are genuinely spread, which is the one this
# selects for. What separates the two passes is which split they read and how much of it.
inference:
  # The pass inside the training loop, over a fixed slice of the validation split. A checkpoint is
  # selected on it, so it is read at the budget the report it is answering for is read at.
  validation_samples: 100
  # The pass over the whole test split that a report is built from. Paid for once per run.
  evaluation_samples: 100
  generation_rows_upper_bound: 10240
