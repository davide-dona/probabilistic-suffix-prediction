# The same backbone with the latent path taken out: the arm the CVAE is read against. Every width
# below matches config/models/cvae.yaml, so what separates the two runs is the latent and nothing
# else. With no z conditioning the decoder, the draws have to come from the heads instead: the
# activity is sampled from its logits at every step and both time heads emit a variance of their
# own. That per-step noise is exactly what the latent exists to avoid, which is the comparison.
model:
  kind: transformer
  name: transformer

  d_model: 32

  embeddings:
    activity_dim: 16
    resource_dim: 32
    feature_dim: 8

  # Reads the prefix alone: with no posterior there is nothing a summary of the suffix would feed.
  encoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1

  decoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1
    # A device of the conditioned decoder alone: blanking a teacher-forced activity is what makes
    # the CVAE lean on z, and there is no z here for it to lean on.
    activity_dropout: 0.0
    head_hidden_dim: 128
