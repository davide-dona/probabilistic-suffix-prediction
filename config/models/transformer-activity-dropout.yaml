# The same backbone with the latent path taken out: the arm the CVAE is read against. Every width
# below matches config/models/cvae.yaml, so what separates the two runs is the latent and nothing
# else. With no z conditioning the decoder, the draws have to come from the activity head instead,
# sampled from its logits at every step. That per-step noise is exactly what the latent exists to
# avoid, which is the comparison.
#
# Both time heads are point regressors, as the CVAE's are and as SuTraN's are, rather than heads
# emitting a scale of their own to be drawn from. A free scale was a second difference between the
# arms, one the latent does not reach, and it was paid for out of the activity head.
#
# `activity_dropout` is the second such difference, and the one this run closes. Pinning the time
# heads left the greedy read still degenerate: on bpic17 `length_ae_point` ended at 53.1 against a
# mean true suffix of 21.1, with 35 of 48 probed prefixes running to the decode cap, where the
# drawn read of the same weights sits at 11.5 and reaches the cap never. The greedy path
# reproduces the truth for five to eight events, then locks onto the log's most repeated activity
# and writes it to the cap: at that step the head gives the repeat 0.67 to 0.72 and EOT under
# 0.001. It is an absorbing fixed point of the argmax map, and the state it sits in - twenty
# consecutive `W_Complete application` - is one no training batch ever contained, so EOT there is
# not unlikely, it is unfitted. A draw escapes with about 0.3 per step, which is why only the
# greedy read dies.
#
# Blanking a share of the teacher-forced activities is what stops a decoder from reading the
# previous token as the whole answer, and it is why the CVAE's greedy read clears the cap by step
# 200 on the same log. It was written for the latent, to push what the blanked position no longer
# says into z, but nothing about it needs one: with no z here the decoder is pushed onto the
# prefix it cross-attends and onto the position it is writing at, which is what a self-loop has no
# answer for. A wait still varies from draw to draw here, through the drawn activity path it is
# read off; a remaining time, read before the first step, does not.
#
# Every non-architecture setting a run needs - the optimizer, the training loop - lives in this
# one file too, so it and a dataset config together fully describe a run. There is no `loss`
# section: with no latent there is no KL term to weigh.
seed: 42

dataloader:
  batch_size: 4096
  # 48 vCPUs, so cores are not the constraint: each worker prefetches two of these batches,
  # and a batch of 4096 padded prefix/suffix pairs is hundreds of MB of host memory.
  num_workers: 12

model:
  kind: transformer
  name: transformer-activity-dropout

  d_model: 32

  embeddings:
    activity_dim: 16
    resource_dim: 32
    feature_dim: 8

  # Reads the prefix alone: with no posterior there is nothing a summary of the suffix would feed.
  encoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1

  decoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1
    # Matched to the CVAE's, so the arms differ in the latent and nothing else. What a blanked
    # position buys differs with the architecture - z there, the prefix and the position here -
    # but what it costs is the same either way: the decoder cannot answer from its own last token.
    activity_dropout: 0.3
    head_hidden_dim: 128

  # How the activity logits are shaped before a draw reads them. Inference-time only: nothing here
  # reaches a gradient, and training and checkpoint selection run at whatever is written here.
  # `pipelines.tune` searches the pair on the validation split once a run is trained, and what it
  # picks is written back here and handed to `pipelines.generate`.
  sampling:
    # Divides the logits. Above 1 flattens every step alike, the ones the process already
    # determines included, which is the per-step noise this arm exists to measure.
    temperature: 1.0
    # Keeps the smallest set of activities summing to this. Unlike the temperature it reads how
    # peaked a step is: 1.0 drops nothing, and the arm draws from the whole softmax.
    top_p: 1.0

optimizer:
  lr: 0.0012
  weight_decay: 0.0
  # A batch this wide takes a few hundred steps to settle; starting it at the full rate is what
  # makes those the steps a run never recovers from. Nothing decays it afterwards.
  warmup_steps: 300

training:
  # Dual RTX A6000 workstation, 48GB GPU memory each; `cuda:0` pins one of the two.
  device: cuda:0
  max_steps: 10000
  val_every_n_steps: 50
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  # Fixed slice of the evaluation set used for validation;
  # Using the full evaluation set for validation would be too slow
  validation_pairs: 20000
  generation_pairs: 1024

early_stopping:
  patience: 30   # number of validation checks with no improvement after which training will be stopped
  min_delta_perc: 0.005

# Suffixes drawn per prefix, once for each of the two passes that generate them.
inference:
  # The pass inside the training loop, kept small: it is paid for on every validation.
  validation_samples: 10
  # The pass over the whole test split that a report is built from. Paid for once per run, and a
  # hundred draws describe p(suffix | prefix) far better than ten.
  evaluation_samples: 100
  generation_rows_upper_bound: 10240
