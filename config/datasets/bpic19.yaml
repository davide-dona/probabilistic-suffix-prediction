data:
  name: bpic19

  # Keys of the raw event log to be mapped to the standard keys used in the framework.
  case_key: "case:concept:name"
  activity_key: "concept:name"
  resource_key: "org:resource"
  timestamp_key: "time:timestamp"

  # Split the dataset into train, validation, and test sets.
  # Splits are applied on the case level, with an out-of-time split
  train_split: 0.65
  val_split: 0.15
  test_split: 0.2

  # Remove cases outside the 98.5 percentile of case length
  max_seq_len_percentile: 98.5
  # Remove cases outside the 99.9 percentile of case duration: a case running far past the
  # scale of its own process is a broken timestamp, and it sets the duration statistics.
  max_case_duration_percentile: 99.9
  # Set of raw features that need to be casted to string type
  string_features:
    - case:GR-Based Inv. Verif.
    - case:Goods Receipt

  event_features:
    # Case-level: share the same value for every row in a case
    - case:Spend area text
    - case:Company
    - case:Document Type
    - case:Sub spend area text
    - case:Purch. Doc. Category name
    - case:Vendor
    - case:Item Type
    - case:Item Category
    - case:Spend classification text
    - case:Source
    - case:GR-Based Inv. Verif.
    - case:Goods Receipt
    # Event-level: vary per row in a case
    - Cumulative net worth (EUR)
    # Minutes since the case began, derived from the timestamp
    - ts_start
    # Calendar position of the event, cyclically encoded
    - day_sin
    - day_cos
    - seconds_sin
    - seconds_cos

  # Right-skewed numeric columns: durations and monetary amounts dominated by a few large
  # values, log1p'd before standardization so the bulk of the distribution is not squashed.
  log_scaled_features:
    - Cumulative net worth (EUR)
    - ts_start
  log_scaled_remaining_time: true
  log_scaled_time_to_next: true
