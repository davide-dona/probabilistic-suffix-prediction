# The other answer to sepsis overfitting: base.yaml's bpic-sized model (`cvae-reg`, 1.41M
# parameters), held back by regularization rather than rebuilt smaller the way `sepsis.yaml`'s
# `cvae-small` is. Same data section as `sepsis.yaml`, so the two are trained and compared on
# identical splits.
data:
  name: sepsis

  # Keys of the raw event log to be mapped to the standard keys used in the framework.
  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"

  # Split the dataset into train, validation, and test sets.
  # Splits are applied on the case level, with an out-of-time split
  train_split: 0.65
  val_split: 0.15
  test_split: 0.2

  # Remove cases outside the 98.5 percentile of case length
  max_seq_len_percentile: 98.5
  # Set of raw features that need to be casted to string type
  string_features: []

  event_features:
    # Event-level: vary per row in a case
    - DiagnosticArtAstrup
    - DiagnosticBlood
    - DiagnosticECG
    - DiagnosticIC
    - DiagnosticLacticAcid
    - DiagnosticLiquor
    - DiagnosticSputum
    - DiagnosticUrinaryCulture
    - DiagnosticUrinarySediment
    - DiagnosticXthorax
    - DisfuncOrg
    - Hypotensie
    - Hypoxie
    - InfectionSuspected
    - Infusion
    - Oligurie
    - SIRSCritHeartRate
    - SIRSCritLeucos
    - SIRSCritTachypnea
    - SIRSCritTemperature
    - SIRSCriteria2OrMore
    - Age
    - CRP
    - LacticAcid
    - Leucocytes
    # Calendar position of the event
    - day_in_week
    - seconds_in_day

  log_scaled_features: []
  log_scaled_durations: false

# Sepsis is by far the smallest of the three logs, and at base.yaml's sizes the model overfits
# within the first ~5% of max_steps: gen/energy_score bottoms out around step 1600-2000 then
# degrades steadily, with gen/sample_diversity collapsing from ~0.51 to ~0.31 over the next 2500
# steps. Extra regularization here, on top of base.yaml's, is meant to push that ceiling back out.
optimizer:
  weight_decay: 0.01

model:
  name: cvae-reg  # names this architecture's runs apart from `sepsis.yaml`'s `cvae-small`
  prefix_encoder:
    dropout: 0.2
  suffix_encoder:
    dropout: 0.2
  prior:
    dropout: 0.2
  decoder:
    dropout: 0.2
