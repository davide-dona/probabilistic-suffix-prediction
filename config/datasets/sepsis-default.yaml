# Unregularized counterpart to sepsis.yaml (model `cvae`, vs. its `cvae-reg`), kept around so the
# two can still be trained and compared side by side.
data:
  name: sepsis

  # Keys of the raw event log to be mapped to the standard keys used in the framework.
  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"

  # Split the dataset into train, validation, and test sets.
  # Splits are applied on the case level, with an out-of-time split
  train_split: 0.65
  val_split: 0.15
  test_split: 0.2

  # Remove cases outside the 98.5 percentile of case length
  max_seq_len_percentile: 98.5
  # Set of raw features that need to be casted to string type
  string_features: []

  event_features:
    # Event-level: vary per row in a case
    - DiagnosticArtAstrup
    - DiagnosticBlood
    - DiagnosticECG
    - DiagnosticIC
    - DiagnosticLacticAcid
    - DiagnosticLiquor
    - DiagnosticSputum
    - DiagnosticUrinaryCulture
    - DiagnosticUrinarySediment
    - DiagnosticXthorax
    - DisfuncOrg
    - Hypotensie
    - Hypoxie
    - InfectionSuspected
    - Infusion
    - Oligurie
    - SIRSCritHeartRate
    - SIRSCritLeucos
    - SIRSCritTachypnea
    - SIRSCritTemperature
    - SIRSCriteria2OrMore
    - Age
    - CRP
    - LacticAcid
    - Leucocytes
    # Calendar position of the event
    - day_in_week
    - seconds_in_day

  log_scaled_features: []
  log_scaled_durations: false
