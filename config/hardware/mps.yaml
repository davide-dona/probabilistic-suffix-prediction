# Apple-silicon GPU, local development.
training:
  device: mps
  # A ceiling, not the expected end of a run: 120 validations, so early stopping's
  # 30-validation patience governs. See base.yaml's early_stopping section.
  max_steps: 96000
  val_every_n_steps: 800

loss:
  kl_annealing_period_steps: 10000

optimizer:
  lr: 0.0003

dataloader:
  batch_size: 256
  num_workers: 0  # 0, not 4: macOS spawn overhead measured 2.1x slower end to end

inference:
  generation_rows_upper_bound: 2560
